<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PaleteWorks</title>
<meta name="description" content="PaleteWorks apps">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2.0.4/fonts/static/woff2/SUITE.css">
<style>
  :root { --white: #FFFFFF; --black: #000000; --gray200: #E2E8F0; --gray500: #62748E; --primary500: #0080FF; --primary700: #0051A5; }
  @media (prefers-color-scheme: dark) {
    :root { --white: #0F172B; --black: #FFFFFF; --gray200: #314158; --gray500: #90A1B9; --primary500: #0080FF; --primary700: #9BC5FF; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--white); color: var(--black); }
  body { font-family: 'SUITE', system-ui, sans-serif; letter-spacing: -0.02em; }
  .page { max-width: 640px; margin: 0 auto; padding: 0 24px 48px; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; padding-top: 100px; }
  .apps { list-style: none; margin: 48px 0 0; padding: 0; }
  .app { border: 1.5px solid var(--gray200); border-radius: 20px; padding: 20px; }
  .app h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .app a { display: inline-block; margin-top: 12px; font-size: 16px; color: var(--primary700); }
  .contact { margin-top: 48px; font-size: 14px; color: var(--gray500); }
  .contact a { color: inherit; }
</style>
</head>
<body>
<div class="page">
  <h1>PaleteWorks</h1>
  <ul class="apps">
    <li class="app">
      <h2>Travler</h2>
      <a href="travler/privacy/">Privacy Policy</a>
    </li>
  </ul>
  <p class="contact"><a href="mailto:paleteworks@gmail.com">paleteworks@gmail.com</a></p>
</div>
</body>
</html>
